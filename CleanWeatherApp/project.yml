name: CleanWeather
options:
  bundleIdPrefix: com.cleanweather
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CleanWeather:
    type: application
    platform: iOS
    sources:
      - path: CleanWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanweather.app
        INFOPLIST_FILE: CleanWeather/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: CleanWeather/CleanWeather.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleanweather.shared
    dependencies:
      - target: CleanWeatherWidget
      - target: CleanWeatherWatch WatchKit App

  CleanWeatherWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CleanWeatherWidget
      - path: CleanWeather/Models
      - path: CleanWeather/Services
      - path: CleanWeather/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanweather.app.widget
        INFOPLIST_FILE: CleanWeatherWidget/Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: CleanWeatherWidget/CleanWeatherWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cleanweather.shared

  CleanWeatherWatch WatchKit App:
    type: application
    platform: watchOS
    sources:
      - path: CleanWeatherWatch
      - path: CleanWeather/Models
      - path: CleanWeather/Services
      - path: CleanWeather/Helpers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanweather.app.watchkitapp
        INFOPLIST_FILE: CleanWeatherWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
